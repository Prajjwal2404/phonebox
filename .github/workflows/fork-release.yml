name: Fork Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.9.21.1). Leave empty to use PhoneBox.Agent.csproj version'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Determine Version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' agent/PhoneBox.Agent/PhoneBox.Agent.csproj | head -n1)
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $V (tag: v$V)"

  agent-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows Agent
        shell: pwsh
        run: |
          dotnet publish agent/PhoneBox.Agent -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -o out --nologo
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/* -DestinationPath "dist/PhoneBoxAgent-${{ needs.version.outputs.version }}-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-agent-win-x64
          path: dist/

  apk:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/PhoneBox-${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/

  publish:
    needs: [version, agent-windows, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum * > "SHA256SUMS-${{ needs.version.outputs.version }}.txt"
          cat "SHA256SUMS-${{ needs.version.outputs.version }}.txt"
      - name: Publish Release to Fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          gh release create "$TAG" dist/* --title "PhoneBox $TAG" --generate-notes --target "${{ github.sha }}"
